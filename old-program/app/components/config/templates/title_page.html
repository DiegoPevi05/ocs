<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Location Results Report</title>

	<style>
		@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

	</style>
	<style>
		/* Set up A4 page size */
		@page {
			size: A4;
			margin: 60px 30px;
		}

		body {
			font-family: 'Poppins', sans-serif;
			color: #000;
			margin: 0;
			/* Avoid extra space when printing */
			padding: 0px 5mm;
		}

		h1 {
			font-size: 1rem;
			color: #5C6C7B;
			text-align: center;
			margin-top: 0;
		}

		table {
			width: 100%;
			border-collapse: collapse;
		}

		th,
		td {
			border: 1px solid #ddd;
			padding: 4px;
			text-align: left;
			font-size: 0.7rem;
			font-weight: 400;
		}

		th {
			background-color: transparent;
		}

		/* Ensure the table fits within A4 width */
		.table-container {
			width: 100%;
			max-width: 100%;
			overflow: hidden;
			margin-top: 20px;
			page-break-inside: avoid;
		}

		.table-header {
			display: grid;
			grid-template-columns: 0.5fr 1fr 0.5fr 1fr 0.5fr 1fr;
			width: 100%;
			justify-items: start;
			border-bottom: 0.5px solid #5C6C7B;
			font-size: 10px;
		}

		.table-header>* {
			padding: 5px 0 0px 5px;
			margin-bottom: 15px;
		}

		.table-container .headings>th {
			width: calc(100% / 6);
		}

		.table-header p:nth-child(1),
		.table-header p:nth-child(3),
		.table-header p:nth-child(5) {
			color: #5C6C7B;
			font-weight: 700;
		}

		.table-container .headings th:nth-child(1),
		.table-container .headings th:nth-child(3),
		.table-container .headings th:nth-child(5) {
			color: #5C6C7B;
			font-weight: 700;
		}


		.table-container .title>th {
			width: 100%;
			font-size: 1.2rem;
			color: #000;
			font-weight: 700;
		}

		.table-container .headers>th {
			border-top: 0px;
			color: #5C6C7B;
			font-weight: 700;
		}

	</style>
</head>

<body>

	<h1 class=".title">{{REPORT_TITLE}}</h1>
  <div class=".logo-company">{{LOGO_COMPANY}}</div>
	<p class=".title-section">{{REPORT_TITLE}}</p>
	<table class="table-title-page">
		<p>{{CREATED_BY_HEADER}}</p>
		<p>{{CREATED_BY}}</p>
		<p>{{CREATION_DATE_HEADER}}</p>
		<p>{{CREATION_DATE}}</p>
	</table>

		<p>{{CREATED_BY_HEADER}}</p>
		<p>{{CREATED_BY}}</p>
		<p>{{CREATION_DATE_HEADER}}</p>
		<p>{{CREATION_DATE}}</p>
	</table>
  -->
</body>

</html>
