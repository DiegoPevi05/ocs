# ─── OCS Docker Compose ───────────────────────────────────────────────────────
#
# Environment variable resolution order (highest → lowest priority):
#   1. Shell environment variables
#   2. Root .env file (auto-loaded by compose for ${VAR} interpolation)
#   3. Per-service env_file (injected into the container)
#   4. Defaults defined below with :- syntax
#
# Networks:
#   backend  — postgres, ocs-calculator, ocs-api (internal services only)
#   frontend — ocs-api, ocs-web (ocs-api bridges both networks)
#
# Setup:
#   cp .env.example .env                  # edit root compose vars
#   cp ocs-api/.env.example ocs-api/.env  # edit API vars
#   docker compose up --build

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: ocs-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      # Read from root .env (auto-loaded by compose)
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── C++ Calculator engine ─────────────────────────────────────────────────────
  ocs-calculator:
    build:
      context: ./ocs-calculator
      dockerfile: Dockerfile
    container_name: ocs-calculator
    restart: unless-stopped
    ports:
      - "${CALCULATOR_PORT:-8081}:8081"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Spring Boot API ───────────────────────────────────────────────────────────
  ocs-api:
    build:
      context: ./ocs-api
      dockerfile: Dockerfile
    container_name: ocs-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    # ocs-api/.env supplies all app vars (DB_URL, JWT_SECRET, CALCULATOR_URL, …)
    # These override the local-dev defaults in application.yml.
    env_file:
      - ./ocs-api/.env
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      ocs-calculator:
        condition: service_started

  # ── React + Three.js Frontend ─────────────────────────────────────────────────
  ocs-web:
    build:
      context: ./ocs-web
      dockerfile: Dockerfile
      args:
        # VITE_ vars are baked into the bundle at build time (not runtime).
        # Values come from root .env (auto-loaded) or shell environment.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_WS_URL: ${VITE_WS_URL}
    container_name: ocs-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - frontend
    depends_on:
      - ocs-api

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  pgdata:
