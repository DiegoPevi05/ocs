# ─── OCS Docker Compose ───────────────────────────────────────────────────────
#
# Environment variable resolution order (highest → lowest priority):
#   1. Shell environment variables
#   2. Root .env file (auto-loaded by compose for ${VAR} interpolation)
#   3. Per-service env_file (injected into the container)
#   4. Defaults defined below with :- syntax
#
# Networks:
#   backend  — postgres, ocs-calculator, ocs-api (internal services only)
#   frontend — ocs-api, ocs-web (ocs-api bridges both networks)
#
# Setup:
#   cp .env.example .env                  # edit root compose vars
#   cp ocs-api/.env.example ocs-api/.env  # edit API vars
#   docker compose up --build

services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: ocs-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ocs_db}
      POSTGRES_USER: ${POSTGRES_USER:-ocs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ocs_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ocs_user} -d ${POSTGRES_DB:-ocs_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── C++ Calculator engine ─────────────────────────────────────────────────────
  ocs-calculator:
    image: ghcr.io/diegopevi05/ocs/ocs-calculator:latest
    container_name: ocs-calculator
    restart: unless-stopped
    ports:
      - "${CALCULATOR_PORT:-8081}:8081"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Spring Boot API ───────────────────────────────────────────────────────────
  ocs-api:
    image: ghcr.io/diegopevi05/ocs/ocs-api:latest
    container_name: ocs-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/ocs_db}
      DB_USERNAME: ${DB_USERNAME:-ocs_user}
      DB_PASSWORD: ${DB_PASSWORD:-ocs_password}
      CALCULATOR_URL: ${CALCULATOR_URL:-http://ocs-calculator:8081}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-strong-256-bit-secret-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      SERVER_PORT: ${SERVER_PORT:-8080}
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      ocs-calculator:
        condition: service_healthy

  # ── React + Three.js Frontend ─────────────────────────────────────────────────
  ocs-web:
    image: ghcr.io/diegopevi05/ocs/ocs-web:latest
    container_name: ocs-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    networks:
      - frontend
    depends_on:
      - ocs-api

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge

volumes:
  pgdata:
