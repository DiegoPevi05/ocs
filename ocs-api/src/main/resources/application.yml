spring:
  application:
    name: ocs-api

  datasource:
    # Local dev default → localhost. Docker overrides via DB_URL env var (ocs-api/.env).
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ocs_db}
    username: ${DB_USERNAME:ocs_user}
    password: ${DB_PASSWORD:ocs_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/migrations/db.changelog-master.yaml
    enabled: true

server:
  port: ${SERVER_PORT:8080}

app:
  calculator:
    # Local dev default → localhost. Docker overrides via CALCULATOR_URL env var.
    url: ${CALCULATOR_URL:http://localhost:8081}
  jwt:
    # Dev default only — always overridden in Docker via JWT_SECRET env var.
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
